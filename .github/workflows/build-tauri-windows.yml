name: build-tauri-windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Install Tauri CLI
        working-directory: tauri
        run: npm install

      - name: Build Windows executable and NSIS installer
        working-directory: tauri
        run: npm run build:win

      - name: Upload Tauri Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moyue-tauri-windows
          path: |
            tauri/src-tauri/target/release/moyue.exe
            tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
