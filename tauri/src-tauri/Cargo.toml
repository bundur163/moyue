[package]
name = "moyue"
version = "1.3.0"
description = "墨阅 · Markdown 阅读器"
authors = ["bundur163"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moyue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
