# 墨阅 · Markdown 阅读器示例

这是「墨阅」的示例文档。打开它之后，文档会被排成一张张固定大小的纸：左边是页面缩略预览，右边是当前页正文。翻页、搜索、选中复制，都在一屏之内完成。

> 一张纸，一页字。翻页的时候，注意力应该留在文字上，而不是留在滚动条上。

## 为什么做成纸面

Markdown 本来是流式文本，适合连续滚动。但长文档滚起来容易失去位置感：读到一半，不知道自己在哪里，也不知道还有多少。PDF 阅读器用固定纸面解决了这个问题，我们把这套体验搬到了 Markdown 上。

- **打开即读**：选择文件后直接排版，没有设置页，也没有多余确认。
- **左侧预览**：每一页都有缩略图，当前页用暖色描边标出，点击即可跳转。
- **右侧阅读**：单页居中显示，按窗口高度等比缩放，也可以手动放大细看。
- **原生复制**：正文使用浏览器原生选区，鼠标选中后 Ctrl+C 即可，不劫持任何操作。
- **本地优先**：文件只在浏览器内存里解析，不上传、不写入，断网也能用。

## 分页是怎么工作的

阅读器先把 Markdown 解析成一个个顶层内容块，再按顺序放进 760 × 1075 的纸面。每放一块就量一次高度，装不下就换下一页。

1. 解析 Markdown，清洗掉脚本与危险链接；
2. 按块测量高度，逐页装箱，块与块之间的间距只算一次；
3. 超长代码块按行拆分到多页，其他超高单块独占一页并在页内滚动；
4. 所有页排完后，统一补上页脚：文档名与「第 N / M 页」。

```js
const page = { width: 760, height: 1075 };
const content = page.height - 64 - 92;

function paginate(blocks) {
  const pages = [];
  let current = [];
  let used = 0;

  for (const block of blocks) {
    const height = measure(block);
    if (used + height > content && current.length) {
      pages.push(current);
      current = [];
      used = 0;
    }
    current.push(block);
    used += height;
  }
  return pages.concat([current]);
}
```

这段代码省略了测量细节，但核心就是「装不下就换页」。真正实现里还要处理外边距、超长代码块和横向溢出的表格，这些都可以在 `assets/app.js` 里看到。

### 一条来自示例的引用

> 好的阅读器应该像一张安静的桌子：文档放在上面，工具退到一边。需要搜索时搜索，需要复制时复制，其余时间不打扰。

## 搜索

在顶栏输入「分页」试试。命中会显示成 `当前 / 总数`，当前页的命中用暖黄色标出，正在查看的那一处颜色更深。按 Enter 去下一处，按 Shift+Enter 回上一处，跨页时会自动翻页。

搜索覆盖整篇文档，包括代码块和表格里的文字。它按文本节点匹配，所以极少数被加粗、链接从中间切开的词组可能搜不到——这是刻意保留原生选区与复制的代价，也是「简单」的一部分。

| 操作 | 方式 |
| --- | --- |
| 打开文件 | 顶栏按钮、拖拽文件、Ctrl+O |
| 上一页 / 下一页 | ← →、PageUp / PageDown、顶栏箭头 |
| 跳到首尾 | Home / End |
| 搜索 | Ctrl+F，Enter / Shift+Enter 切换命中 |
| 清除搜索 | Esc |
| 缩放 | 顶栏 − / +，点击百分比恢复适应窗口 |

## 复制

用鼠标在正文里拖选，然后按 Ctrl+C，或者右键复制。搜索高亮不会改写正文的 DOM，因此不会把高亮标记一起复制出去；页脚、页码和缩略图也不在选区里。

如果一页里既有正文又有代码，可以一起选中；代码块内部横向滚动时，选中的仍然是完整文本。链接会保留地址，表格会按制表符整理成可粘贴的文本。

## 支持哪些 Markdown

- 标题、段落、加粗、斜体、删除线
- 有序列表、无序列表、任务列表
- 引用、分隔线、链接、图片
- 围栏代码块与行内代码
- GFM 表格
- 原始 HTML（经过安全清洗，脚本与事件属性会被移除）

任务列表可以这样写：

- [x] 打开示例文档
- [x] 在左侧缩略图之间跳转
- [ ] 打开你自己的 Markdown 文件
- [ ] 用 Ctrl+F 搜一个词，再按 Enter

## 一点使用建议

把窗口拉大，纸面会跟着变大；点击顶栏右侧的百分比可以随时回到「适应窗口」。左侧预览可以收起，给正文让出更多空间；再点一下左边缘的展开按钮就能找回来。

如果文档里有特别长的代码块，它会独占一页并在页内滚动，页脚会提示这一页「含长内容」。这是为了保证代码不被拦腰截断，也是固定纸面排版里比较稳妥的取舍。

## 写在最后

Markdown 的好处是内容和样式分开：作者只关心写什么，阅读器负责怎么放。这个阅读器只做一件事——把写好的文字，安静地放到纸上。

你可以现在就打开自己的文档。拖拽进来，或者按 Ctrl+O。第一页出现的时候，阅读就已经开始了。

> 墨阅 · 让 Markdown 像一本书。
